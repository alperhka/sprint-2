[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-ag-integration"
version = "0.1.0"
description = "Integrationslösung für die Shop AG (Aufgabe 2 Integration)."
authors = [
  { name = "Team Shop AG" }
]
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<0.115",
  "uvicorn[standard]>=0.23,<0.31",
  "pydantic>=2.7,<2.9",
  "grpcio>=1.62,<1.65",
  "grpcio-tools>=1.62,<1.65",
  "tenacity>=8.2,<9.0",
  "pika>=1.3,<2.0",
  "requests>=2.31,<2.33",
  "python-dotenv>=1.0,<1.1",
  "aiofiles>=23.0,<24.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.1,<8.3",
  "pytest-asyncio>=0.23,<0.25",
  "httpx>=0.27,<0.28",
  "ruff>=0.4,<0.6",
  "mypy>=1.8,<1.11"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]

